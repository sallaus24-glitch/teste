<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador Preditivo MASTER PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f1f5f9; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3">

    <div class="w-full max-w-md bg-slate-900/95 backdrop-blur-md rounded-2xl shadow-2xl p-4 border border-slate-800">
        
        <!-- Cabeçalho Limpo -->
        <header class="text-center mb-3">
            <div class="inline-flex items-center justify-center p-2 bg-emerald-500/10 rounded-xl border border-emerald-500/20 text-emerald-400 mb-1">
                <i data-lucide="brain-circuit" class="w-5 h-5"></i>
            </div>
            <h1 class="text-base font-extrabold text-white tracking-wide">MASTER PRO AI</h1>
            <p class="text-[11px] text-slate-400">Inteligência Acumulativa & Nuvem Ativa</p>
        </header>

        <!-- Visor do Número Atual Sendo Digitado -->
        <div class="flex gap-2 mb-3">
            <div id="visorNumero" class="flex-1 bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-2 text-center text-2xl font-bold mono text-emerald-400 flex items-center justify-center tracking-widest shadow-inner min-h-[50px]">
                -
            </div>
            <button onclick="apagarDigito()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 rounded-xl transition border border-slate-700 flex items-center justify-center active:scale-95" title="Apagar">
                <i data-lucide="delete" class="w-5 h-5"></i>
            </button>
            <button onclick="confirmarNumero()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 rounded-xl transition shadow-lg shadow-emerald-900/40 flex items-center justify-center text-xs active:scale-95">
                Inserir
            </button>
        </div>

        <!-- Teclado Tátil Personalizado (0 a 9) -->
        <div class="grid grid-cols-5 gap-1.5 mb-3 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
            <button onclick="digitar(1)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">1</button>
            <button onclick="digitar(2)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">2</button>
            <button onclick="digitar(3)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">3</button>
            <button onclick="digitar(4)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">4</button>
            <button onclick="digitar(5)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">5</button>
            
            <button onclick="digitar(6)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">6</button>
            <button onclick="digitar(7)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">7</button>
            <button onclick="digitar(8)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">8</button>
            <button onclick="digitar(9)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-white font-bold py-3 rounded-lg text-base transition active:bg-emerald-600 active:scale-95 shadow-sm">9</button>
            <button onclick="digitar(0)" class="bg-emerald-950/90 hover:bg-emerald-900 border border-emerald-700/80 text-emerald-400 font-bold py-3 rounded-lg text-base transition active:scale-95 shadow-sm">0</button>
        </div>

        <!-- Mapa do Último Número & Colunas -->
        <div class="mb-3 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
            <div class="flex justify-between items-center mb-1.5">
                <span class="text-[11px] font-semibold text-slate-400 flex items-center gap-1">
                    <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Mapa do Último Número
                </span>
                <span id="badgeUltimoMapa" class="text-xs bg-slate-800 text-slate-200 px-2.5 py-0.5 rounded mono font-bold">-</span>
            </div>
            <div class="grid grid-cols-4 gap-1 text-center text-xs font-bold">
                <div id="grid-0" class="bg-emerald-950/40 border border-emerald-800/50 rounded p-1.5 flex flex-col justify-center items-center text-emerald-400">
                    <span class="text-[8px] text-slate-500">ZERO</span>
                    <span class="text-xs">0</span>
                </div>
                <div class="col-span-3 grid grid-cols-3 gap-1">
                    <div id="grid-col-1" class="bg-slate-900 border border-slate-800 rounded p-1.5 flex flex-col justify-center">
                        <span class="text-[8px] text-slate-500">COL 1</span>
                        <span class="text-slate-300">-</span>
                    </div>
                    <div id="grid-col-2" class="bg-slate-900 border border-slate-800 rounded p-1.5 flex flex-col justify-center">
                        <span class="text-[8px] text-slate-500">COL 2</span>
                        <span class="text-slate-300">-</span>
                    </div>
                    <div id="grid-col-3" class="bg-slate-900 border border-slate-800 rounded p-1.5 flex flex-col justify-center">
                        <span class="text-[8px] text-slate-500">COL 3</span>
                        <span class="text-slate-300">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Barra de Confiabilidade da Amostra -->
        <div class="mb-3 bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
            <div class="flex justify-between text-[11px] mb-1">
                <span class="text-slate-400 flex items-center gap-1">
                    <i data-lucide="gauge" class="w-3.5 h-3.5"></i> Confiabilidade da Amostra
                </span>
                <span id="labelConfiabilidade" class="font-bold text-slate-400">0% (Sincronizando...)</span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div id="barraConfiabilidade" class="bg-amber-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Painel de Segmentos Individuais (Aprendizado Acumulativo) -->
        <div class="bg-slate-950 border border-emerald-500/30 rounded-xl p-3 mb-3 shadow-inner">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                <i data-lucide="cpu" class="w-4 h-4"></i> Análise Preditiva Acumulada
            </h2>
            
            <div id="painelPrevisao" class="text-center text-slate-400 text-xs py-2">
                Carregando histórico do banco de dados...
            </div>
        </div>

        <!-- Estatísticas da Sessão -->
        <div class="grid grid-cols-2 gap-2 mb-3 text-xs">
            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80">
                <span class="text-slate-500 block text-[10px]">Total Analisado (Nuvem):</span>
                <span id="statTotal" class="text-sm font-bold text-white">0</span>
            </div>
            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80">
                <span class="text-slate-500 block text-[10px]">Últimos Números:</span>
                <span id="statUltimos" class="text-emerald-400 mono font-semibold truncate block text-xs">-</span>
            </div>
        </div>

        <!-- Botão de Reiniciar Sessão -->
        <button onclick="limparSessao()" class="w-full bg-rose-950/40 hover:bg-rose-900/40 border border-rose-800/50 text-rose-300 font-semibold py-2 rounded-xl transition flex items-center justify-center gap-2 text-xs active:scale-95">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Nova Sessão / Limpar Linha de Raciocínio
        </button>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://vzqhthduwhhuigybxvin.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YZKksjHIVt8JrGgCh-qKWg_C2aZeNYm';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let historicoSessao = [];
        let sessionId = localStorage.getItem('master_session_id') || ('sessao_' + Date.now());
        localStorage.setItem('master_session_id', sessionId);
        let entradaAtual = "";

        const numerosVermelhos = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

        function obterCor(n) {
            if (n === 0) return 'Verde';
            return numerosVermelhos.includes(n) ? 'Vermelho' : 'Preto';
        }

        // Ao abrir o aplicativo, carrega automaticamente todo o histórico salvo no banco de dados
        async function carregarHistoricoNuvem() {
            try {
                const { data, error } = await supabaseClient
                    .from('historico_analise')
                    .select('numero, session_id, criado_em')
                    .order('criado_em', { ascending: true })
                    .limit(100); // Puxa os dados mais recentes para base de aprendizado

                if (error) throw error;

                if (data && data.length > 0) {
                    // Filtra para pegar a sessão atual ou a mais recente ativa
                    const ultimaSessaoId = data[data.length - 1].session_id;
                    sessionId = ultimaSessaoId;
                    localStorage.setItem('master_session_id', sessionId);

                    historicoSessao = data.map(item => item.numero);
                    let ultimoNum = historicoSessao[historicoSessao.length - 1];
                    
                    atualizarInterface(ultimoNum);
                } else {
                    document.getElementById('painelPrevisao').innerHTML = `<span class="text-slate-400 italic text-xs">Banco conectado. Insira o primeiro número para iniciar.</span>`;
                }
            } catch (e) {
                console.error('Erro ao carregar histórico da nuvem:', e);
                document.getElementById('painelPrevisao').innerHTML = `<span class="text-rose-400 italic text-xs">Erro ao conectar com a nuvem. Verifique a internet.</span>`;
            }
        }

        function digitar(num) {
            if (entradaAtual.length >= 2) {
                entradaAtual = num.toString();
            } else {
                entradaAtual += num.toString();
            }

            let valInt = parseInt(entradaAtual);
            if (valInt > 36) {
                entradaAtual = num.toString();
            }

            document.getElementById('visorNumero').innerText = entradaAtual;
        }

        function apagarDigito() {
            entradaAtual = "";
            document.getElementById('visorNumero').innerText = "-";
        }

        async function confirmarNumero() {
            if (entradaAtual === "") return;
            const valor = parseInt(entradaAtual);

            if (isNaN(valor) || valor < 0 || valor > 36) {
                alert('Número inválido. Digite de 0 a 36.');
                apagarDigito();
                return;
            }

            historicoSessao.push(valor);
            apagarDigito();

            atualizarInterface(valor);

            // Salva na nuvem em tempo real para alimentar a inteligência acumulativa
            if (supabaseClient) {
                try {
                    await supabaseClient.from('historico_analise').insert([
                        { session_id: sessionId, numero: valor }
                    ]);
                } catch (e) {
                    console.error('Erro ao sincronizar com o banco:', e);
                }
            }
        }

        function atualizarInterface(ultimoValor) {
            const total = historicoSessao.length;
            document.getElementById('statTotal').innerText = total;
            
            const ultimos5 = historicoSessao.slice(-5).join(', ');
            document.getElementById('statUltimos').innerText = ultimos5 || '-';

            if (ultimoValor !== undefined) {
                let corUltimo = obterCor(ultimoValor);
                let badgeCorClass = corUltimo === 'Vermelho' ? 'bg-rose-900/80 text-rose-300' : (corUltimo === 'Preto' ? 'bg-slate-800 text-slate-300' : 'bg-emerald-900 text-emerald-300');
                document.getElementById('badgeUltimoMapa').innerHTML = `#${ultimoValor} <span class="text-[9px] px-1.5 py-0.5 rounded ${badgeCorClass}">${corUltimo}</span>`;
                
                [1, 2, 3].forEach(c => {
                    const el = document.getElementById(`grid-col-${c}`);
                    el.className = "bg-slate-900 border border-slate-800 rounded p-1.5 flex flex-col justify-center";
                });

                if (ultimoValor > 0) {
                    let colAtual = (ultimoValor % 3 === 0) ? 3 : ultimoValor % 3;
                    const elAtivo = document.getElementById(`grid-col-${colAtual}`);
                    elAtivo.className = "bg-emerald-950/70 border border-emerald-600 rounded p-1.5 flex flex-col justify-center text-emerald-400 font-bold";
                }
            }

            let confPercent = Math.min(Math.round((total / 15) * 100), 100);
            const barra = document.getElementById('barraConfiabilidade');
            const labelConf = document.getElementById('labelConfiabilidade');
            
            barra.style.width = confPercent + '%';
            if (confPercent < 40) {
                barra.className = "bg-amber-500 h-full transition-all duration-300";
                labelConf.innerText = `${confPercent}% (Aprendendo com o Banco)`;
            } else if (confPercent < 80) {
                barra.className = "bg-blue-500 h-full transition-all duration-300";
                labelConf.innerText = `${confPercent}% (Calibragem Avançada)`;
            } else {
                barra.className = "bg-emerald-500 h-full transition-all duration-300";
                labelConf.innerText = `${confPercent}% (Alta Precisão Acumulada)`;
            }

            analisarSegmentosIndividuais();
        }

        function analisarSegmentosIndividuais() {
            const painel = document.getElementById('painelPrevisao');
            
            if (historicoSessao.length < 5) {
                painel.innerHTML = `<span class="text-slate-400 italic text-xs">Aguardando dados suficientes na base... (${historicoSessao.length}/5)</span>`;
                return;
            }

            // Análise estatística ponderada com todo o histórico acumulado
            let atrasoVermelho = 0, atrasoPreto = 0;
            historicoSessao.slice().reverse().forEach((n, idx) => {
                if (n > 0) {
                    let c = obterCor(n);
                    if (c === 'Vermelho' && atrasoVermelho === 0) atrasoVermelho = idx;
                    if (c === 'Preto' && atrasoPreto === 0) atrasoPreto = idx;
                }
            });
            let corMaisForte = atrasoVermelho > atrasoPreto ? "Vermelho 🟥" : "Preto ⬛";
            let forcaCor = Math.abs(atrasoVermelho - atrasoPreto) >= 2 ? " 🔥" : "";

            let atrasoBaixo = 0, atrasoAlto = 0;
            historicoSessao.slice().reverse().forEach((n, idx) => {
                if (n > 0) {
                    if (n <= 18 && atrasoBaixo === 0) atrasoBaixo = idx;
                    if (n > 18 && atrasoAlto === 0) atrasoAlto = idx;
                }
            });
            let faixaForte = atrasoAlto > atrasoBaixo ? "Altos (19-36)" : "Baixos (1-18)";
            let forcaFaixa = Math.abs(atrasoAlto - atrasoBaixo) >= 2 ? " ⚡" : "";

            let atrasoPar = 0, atrasoImpar = 0;
            historicoSessao.slice().reverse().forEach((n, idx) => {
                if (n > 0) {
                    if (n % 2 === 0 && atrasoPar === 0) atrasoPar = idx;
                    if (n % 2 !== 0 && atrasoImpar === 0) atrasoImpar = idx;
                }
            });
            let paridadeForte = atrasoPar > atrasoImpar ? "Par" : "Ímpar";
            let forcaParidade = Math.abs(atrasoPar - atrasoImpar) >= 2 ? " 🔥" : "";

            let atrasoCols = [0, 0, 0];
            historicoSessao.slice().reverse().forEach((n, idx) => {
                if (n > 0) {
                    let col = (n % 3 === 0) ? 3 : n % 3;
                    if (atrasoCols[col - 1] === 0) atrasoCols[col - 1] = idx;
                }
            });
            let maxColAtraso = Math.max(...atrasoCols);
            let colSugeridaIdx = atrasoCols.indexOf(maxColAtraso);
            let colunaForte = `${colSugeridaIdx + 1}ª Coluna`;
            let forcaColuna = maxColAtraso >= 3 ? " ⚡" : "";

            let atrasoQuartis = [0, 0, 0, 0];
            historicoSessao.slice().reverse().forEach((n, idx) => {
                if (n > 0) {
                    let q = n <= 9 ? 0 : (n <= 18 ? 1 : (n <= 27 ? 2 : 3));
                    if (atrasoQuartis[q] === 0) atrasoQuartis[q] = idx;
                }
            });
            let maxQAtraso = Math.max(...atrasoQuartis);
            let qSugeridoIdx = atrasoQuartis.indexOf(maxQAtraso);
            let nomesQ = ["Q1 (1-9)", "Q2 (10-18)", "Q3 (19-27)", "Q4 (28-36)"];
            let quartilForte = nomesQ[qSugeridoIdx];
            let forcaQuartil = maxQAtraso >= 4 ? " 🔥" : "";

            painel.innerHTML = `
                <div class="grid grid-cols-2 gap-2 text-xs text-left">
                    <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 shadow-sm">
                        <span class="text-[9px] text-slate-400 block uppercase font-semibold mb-0.5">Cor Dominante</span>
                        <span class="text-white font-bold text-xs">${corMaisForte}${forcaCor}</span>
                    </div>
                    <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 shadow-sm">
                        <span class="text-[9px] text-slate-400 block uppercase font-semibold mb-0.5">Faixa (Altura)</span>
                        <span class="text-white font-bold text-xs">${faixaForte}${forcaFaixa}</span>
                    </div>
                    <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 shadow-sm">
                        <span class="text-[9px] text-slate-400 block uppercase font-semibold mb-0.5">Paridade</span>
                        <span class="text-white font-bold text-xs">${paridadeForte}${forcaParidade}</span>
                    </div>
                    <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 shadow-sm">
                        <span class="text-[9px] text-slate-400 block uppercase font-semibold mb-0.5">Coluna em Déficit</span>
                        <span class="text-emerald-400 font-bold text-xs">${colunaForte}${forcaColuna}</span>
                    </div>
                </div>
                <div class="mt-2 bg-slate-900/90 p-2.5 rounded-xl border border-emerald-500/30 text-center shadow-sm">
                    <span class="text-[9px] text-emerald-400 block uppercase font-bold tracking-wider mb-0.5">Quartil de Maior Pressão (Alvo)</span>
                    <span class="text-white font-extrabold text-sm">${quartilForte}${forcaQuartil}</span>
                </div>
            `;
        }

        function limparSessao() {
            if (confirm("Deseja iniciar uma nova linha de raciocínio e gerar um novo ID de sessão?")) {
                sessionId = 'sessao_' + Date.now();
                localStorage.setItem('master_session_id', sessionId);
                historicoSessao = [];
                entradaAtual = "";
                document.getElementById('visorNumero').innerText = "-";
                atualizarInterface();
                document.getElementById('badgeUltimoMapa').innerText = '-';
                [1, 2, 3].forEach(c => {
                    document.getElementById(`grid-col-${c}`).className = "bg-slate-900 border border-slate-800 rounded p-1.5 flex flex-col justify-center";
                });
                document.getElementById('painelPrevisao').innerHTML = `<span class="text-slate-400 italic text-xs">Nova sessão iniciada. Aguardando dados...</span>`;
            }
        }

        // Executa o carregamento automático da nuvem assim que a página abre
        window.onload = function() {
            carregarHistoricoNuvem();
        };
    </script>
</body>
</html>
